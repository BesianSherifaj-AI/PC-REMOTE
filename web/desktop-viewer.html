<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAIC desktop viewer</title>
<style>
:root{--paper:#f4f5ef;--ink:#18392f;--muted:#68776c;--line:#dce2d7;--lime:#c0ec83}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}
body{display:flex;flex-direction:column;padding:0}
/* Native/full-viewport viewers can extend beneath an iPhone notch or home
   indicator. Keep local controls inside the safe area; padding stays zero on
   PC and browsers that do not expose these environment values. */
@supports(padding:env(safe-area-inset-left)){
  body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
}
#toolbar,#zoomControls,#typing,#scroll{display:flex;flex-shrink:0;padding:4px 7px}
#toolbar{background:#fff;border-bottom:1px solid var(--line)}
button{flex:1;min-width:44px;min-height:44px;margin:0 3px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:bold 12px Arial,sans-serif;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover{background:#edf2e8;border-color:#b4c2aa}
button:focus{outline:2px solid #789c55;outline-offset:1px}
button:disabled{opacity:.42;cursor:default}
button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--lime)}
#control[aria-pressed=true]{color:#fff}
#control[aria-pressed=true]::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--lime);vertical-align:1px}
#scale[aria-pressed=true],#quality[aria-pressed=true]{background:#eaf3df;border-color:#c9dab8;color:var(--ink)}
#zoomControls{align-items:center;background:var(--paper);border-bottom:1px solid var(--line)}
#zoomControls button{flex:0 0 auto;min-width:44px;padding:6px 10px}
#zoomLevel{min-width:62px;text-align:center;font-size:12px;font-weight:bold;font-variant-numeric:tabular-nums}
#gestureHint{flex:1;margin:0 8px;color:var(--muted);font-size:11px;line-height:1.35}
#screen{flex:1;min-height:0;overflow:hidden;background:#112820;touch-action:none;overscroll-behavior:none}
#screen>div{overflow:hidden!important}
#screen canvas{flex-shrink:0}
#typing,#scroll{background:#fff;border-bottom:1px solid var(--line)}
input{flex:1;min-width:0;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px Arial,sans-serif}
input:focus{outline:2px solid #789c55;outline-offset:1px}
#typing button{flex:0 0 75px;background:var(--ink);border-color:var(--ink);color:var(--lime)}
#scroll button{padding:6px;font-size:11px}
#status{flex-shrink:0;min-height:23px;padding:5px 10px;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px;line-height:1.25;overflow-wrap:break-word}
body [hidden]{display:none!important}
/* Two compact rows keep every action reachable on a 360px touchscreen. */
@media(max-width:600px){
  #toolbar,#scroll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:4px;padding:4px 6px}
  #toolbar button,#scroll button{margin:0;min-width:0;padding:6px 3px;font-size:11px;white-space:normal;overflow-wrap:break-word}
  #fullscreen{grid-column:span 2}
  #scroll{max-height:144px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #zoomControls{padding:4px 6px}
  #zoomControls button{margin:0 2px;padding:6px 9px}
  #zoomLevel{min-width:52px}
  #gestureHint{display:none}
  #typing{padding:4px 6px}
  #typing button{flex-basis:65px;margin-left:5px}
  #status{padding:4px 8px;font-size:10px}
}
@media(max-width:340px){#toolbar,#scroll{grid-template-columns:repeat(3,minmax(0,1fr))}#fullscreen{grid-column:auto}#zoomControls button{padding:6px}}
</style></head><body>
<div id="toolbar" role="group" aria-label="Desktop mode and controls"><button id="control" type="button" aria-pressed="true" title="One finger controls Windows; two fingers pan and pinch-zoom.">Control</button><button id="pan" type="button" aria-pressed="false" title="One-finger panning; Windows input is blocked.">Pan only</button><button id="viewOnly" type="button" aria-pressed="false">View only</button><button id="scale" type="button" aria-pressed="true">Fit screen</button><button id="keyboard" type="button">Keyboard</button><button id="scrollToggle" type="button">Scroll / keys</button><button id="fullscreen" type="button" aria-pressed="false">Expand view</button></div>
<div id="zoomControls"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLevel">Fit</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomActual" title="Show desktop at its original size">100%</button><button id="quality" aria-pressed="false" title="Switch between responsive and sharper images">Fast</button><span id="gestureHint">One finger controls Windows; two fingers pan and pinch this view.</span></div>
<form id="typing" hidden><input id="keys" aria-label="Text to type on Windows" autocomplete="off" autocapitalize="off" placeholder="Text for focused PC field"><button type="submit">Type</button></form>
<div id="scroll" hidden><button data-wheel="-120" title="Scroll at the last point touched on the desktop">Scroll ↑</button><button data-wheel="120" title="Scroll at the last point touched on the desktop">Scroll ↓</button><button data-key="65307">Esc</button><button data-key="65289">Tab</button><button data-key="65293">Enter</button><button data-key="65288">⌫</button><button id="rightClick">Right click</button><button data-chord="copy">Ctrl+C</button><button data-chord="paste">Ctrl+V</button><button data-chord="switch">Alt+Tab</button><button id="cad">Ctrl Alt Del</button></div>

screen.addEventListener('mouseup', event => { if (localPanning() || ghostMouse(event)) consume(event); }, true);

  if (!canInput()) return;
